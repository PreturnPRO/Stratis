# S1-T01-C — Basic CI: project must typecheck and build on every push. Runs on
# the repo's active branches (main / beta / delta). Frontend lives at the repo
# root; the backend is in ./backend.
name: CI

on:
  push:
    branches: [main, beta, delta]
  pull_request:
    branches: [main, beta, delta]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Backend uses the built-in node:sqlite driver (Node >= 22.5).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm --prefix backend install

      - name: Typecheck backend (lint gate — must not crash)
        run: npm --prefix backend run typecheck

      # These cover logic no reviewer can eyeball: recovering JSON from
      # prose-wrapped model output, Thai/English near-duplicate matching,
      # Retry-After parsing and backoff caps. Break one and nothing crashes —
      # the transcript just quietly gets worse. Previously the suite existed but
      # CI never ran it, so it only protected whoever remembered `npm test`.
      - name: Test backend + ai-service
        run: npm --prefix backend test

      - name: Build frontend (root)
        run: npm run build
